<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Omni IDE</title>
<link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/node_modules/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="/node_modules/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="/node_modules/codemirror/addon/merge/merge.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-menu" aria-label="Menu">&#9776;</button>
    <span id="title">Omni IDE</span>
    <input id="search-input" placeholder="Search files..." aria-label="Search">
    <button id="btn-settings" aria-label="Settings">&#9881;</button>
  </header>
  <div id="drawer">
    <ul>
      <li data-panel="files">&#128194; Files</li>
      <li data-panel="editor">&#9998; Editor</li>
      <li data-panel="terminal">&#9000; Terminal</li>
      <li data-panel="git">&#128269; Git</li>
    </ul>
  </div>
  <main>
    <div id="panel-files" class="panel"><div id="tree"></div></div>
    <div id="panel-editor" class="panel" style="display:none"></div>
    <div id="panel-terminal" class="panel" style="display:none"><div id="term"></div></div>
    <div id="panel-git" class="panel" style="display:none">
      <div id="git-status"></div>
      <div id="git-log"></div>
      <div id="git-diff"></div>
    </div>
  </main>
  <nav id="tabs">
    <button data-panel="files">&#128194;</button>
    <button data-panel="editor">&#9998;</button>
    <button data-panel="terminal">&#9000;</button>
    <button data-panel="git">&#128269;</button>
  </nav>
</div>
<div id="toast" style="display:none"></div>

<script src="/node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="/node_modules/codemirror/lib/codemirror.js"></script>
<script src="/node_modules/codemirror/addon/edit/closebrackets.js"></script>
<script src="/node_modules/codemirror/addon/edit/matchbrackets.js"></script>
<script src="/node_modules/codemirror/addon/search/searchcursor.js"></script>
<script src="/node_modules/codemirror/addon/search/search.js"></script>
<script src="/node_modules/codemirror/addon/dialog/dialog.js"></script>
<script src="/node_modules/codemirror/addon/fold/brace-fold.js"></script>
<script src="/node_modules/codemirror/addon/fold/foldcode.js"></script>
<script src="/node_modules/codemirror/addon/fold/foldgutter.js"></script>
<script src="/node_modules/codemirror/addon/fold/indent-fold.js"></script>
<script src="/node_modules/codemirror/addon/comment/comment.js"></script>
<script src="/node_modules/codemirror/keymap/sublime.js"></script>
<script src="/node_modules/codemirror/mode/javascript/javascript.js"></script>
<script src="/node_modules/codemirror/mode/python/python.js"></script>
<script src="/node_modules/codemirror/mode/shell/shell.js"></script>
<script src="/node_modules/codemirror/mode/json/json.js"></script>
<script src="/node_modules/codemirror/mode/htmlmixed/htmlmixed.js"></script>
<script src="/node_modules/codemirror/mode/css/css.js"></script>
<script src="/node_modules/codemirror/mode/markdown/markdown.js"></script>
<script src="/node_modules/codemirror/mode/yaml/yaml.js"></script>
<script src="/node_modules/codemirror/mode/gfm/gfm.js"></script>
<script src="/node_modules/codemirror/mode/go/go.js"></script>
<script src="/node_modules/codemirror/mode/rust/rust.js"></script>
<script src="/node_modules/codemirror/mode/clike/clike.js"></script>
<script src="js/app.js"></script>
</body>
</html>
